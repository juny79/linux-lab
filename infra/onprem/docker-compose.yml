version: "3.9"

services:
  linux-lab-api:
    image: python:3.13-slim
    container_name: linux-lab-api
    working_dir: /app
    command: python backend/server.py
    environment:
      - HOST=0.0.0.0
      - PORT=8080
    ports:
      - "8080:8080"
    volumes:
      - ../../:/app
    restart: unless-stopped
